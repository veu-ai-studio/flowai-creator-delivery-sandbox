name: CI

on:
  push:
    branches:
      - flowai-v0.1
  pull_request:
    branches:
      - flowai-v0.1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: install · test · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: npm test
        run: npm test

      - name: eslint
        run: npm run lint

      - name: vite build
        run: npm run build
        env:
          NODE_ENV: production

  rls-audit:
    name: rls audit (static)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit RLS policies (static)
        run: node scripts/audit-rls.mjs --static-only --report rls-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-audit-report
          path: rls-audit-report.json
          retention-days: 14
